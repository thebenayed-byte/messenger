<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermès Messenger</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}
.container {
  padding: 15px;
}
h2 {
  text-align: center;
}
button, input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}
button {
  background: #2563eb;
  color: white;
}
#chat {
  display: none;
}
.messages {
  height: 65vh;
  overflow-y: auto;
  background: #020617;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 10px;
}
.msg {
  background: #1e293b;
  padding: 8px 12px;
  margin-bottom: 6px;
  border-radius: 12px;
  max-width: 80%;
}
.me {
  background: #2563eb;
  margin-left: auto;
}
#info {
  text-align: center;
  margin-top: 10px;
  color: #facc15;
}
</style>
</head>

<body>
<div class="container">

<h2>🔐 Hermès Messenger</h2>

<!-- LOGIN -->
<div id="login">
  <button id="genBtn" onclick="generate()">Générer le mot de passe</button>
  <input id="password" placeholder="Entrer le mot de passe">
  <button onclick="join()">Se connecter</button>
  <p id="info"></p>
</div>

<!-- CHAT -->
<div id="chat">
  <div class="messages" id="messages"></div>
  <input id="msg" placeholder="Votre message">
  <button onclick="send()">Envoyer</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const info = document.getElementById("info");

// Générer mot de passe (une seule fois)
function generate() {
  fetch("/generate")
    .then(res => res.json())
    .then(data => {
      if (data.password) {
        info.innerText = "Mot de passe : " + data.password;
        document.getElementById("genBtn").style.display = "none";
      }
    });
}

// Connexion
function join() {
  const pwd = document.getElementById("password").value;
  socket.emit("join", pwd);
}

// Connecté
socket.on("joined", () => {
  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "block";
});

// Erreur
socket.on("errorMessage", (msg) => {
  info.innerText = msg;
});

// Envoi bouton
function send() {
  const input = document.getElementById("msg");
  const msg = input.value.trim();
  if (!msg) return;
  addMessage(msg, true);
  socket.emit("message", msg);
  input.value = "";
}

// Envoi avec ENTER
document.getElementById("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const msg = e.target.value.trim();
    if (!msg) return;
    addMessage(msg, true);
    socket.emit("message", msg);
    e.target.value = "";
  }
});

// Réception message
socket.on("message", (msg) => {
  addMessage(msg, false);
});

// Affichage message
function addMessage(text, me) {
  const div = document.createElement("div");
  div.className = "msg" + (me ? " me" : "");
  div.innerText = text;
  document.getElementById("messages").appendChild(div);
  div.scrollIntoView({ behavior: "smooth" });
}
</script>

</div>
</body>
</html>
