<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hermès Messenger</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Écran de connexion -->
  <div id="loginScreen">
    <h2>Hermès Messenger</h2>
    <input type="text" id="pseudoInput" placeholder="Entrez votre pseudo..." />
    <button onclick="connect()">Se connecter</button>
  </div>

  <!-- Interface principale du chat -->
  <div id="chatApp" style="display: none;">
    <header>
      <h1>Hermès Messenger</h1>
      <span id="userPseudo"></span>
    </header>

    <div class="main">
      <!-- Utilisateurs connectés -->
      <aside id="userList">
        <h3>Utilisateurs connectés</h3>
        <ul id="users"></ul>
      </aside>

      <!-- Messages de groupe -->
      <section class="chat-section" id="groupChat">
        <h3>Groupe</h3>
        <div class="messages" id="groupMessages"></div>
        <div class="input-area">
<input type="text" id="groupInput" placeholder="Message groupe..." />
          <button onclick="sendGroupMessage()">Envoyer</button>
        </div>
      </section>

      <!-- Messages privés -->
      <section class="chat-section" id="privateChat">
        <h3>Privé</h3>
        <select id="privateUser">
          <option value="">Choisir un utilisateur</option>
        </select>
        <div class="messages" id="privateMessages"></div>
        <div class="input-area">
          <input type="text" id="privateInput" placeholder="Message privé..." />
          <button onclick="sendPrivateMessage()">Envoyer</button>
        </div>
      </section>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
